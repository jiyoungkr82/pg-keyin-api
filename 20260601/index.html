<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>키인 결제</title>
  <!-- jQuery 3.7.1 -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
  <!-- 커스텀 스타일 -->
  <link rel="stylesheet" href="css/style.css">
  <!-- jQuery 3.7.1 CDN -->
  <!-- <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHMnYbMtrrjYfrA8ypuK4cqOt6aQ=" crossorigin="anonymous"></script> -->
</head>

<body>
  <div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 760px;">
      <div class="card-body">
        <h1 class="h4 mb-2">키인 결제</h1>
        <p class="text-muted mb-4">카드 정보를 입력하고 결제를 진행합니다.</p>

        <form method="post" action="pay_submit.php" id="payForm" autocomplete="off" novalidate>
          <!-- CSRF 토큰 샘플 데이터 임시 삽입 -->
          <input type="hidden" name="csrf" value="sample_csrf_token_value">

          <div class="mb-4">
            <h2 class="h6 mb-3">주문 정보</h2>

            <div class="mb-3">
              <label for="amount" class="form-label">결제금액 (원) <span class="text-danger">*</span></label>
              <input id="amount" type="number" name="amount" aria-invalid="false" aria-describedby="amount-feedback" class="form-control" min="100" max="9999999" step="1" required
                placeholder="100 이상" value="1000">
              <div id="amount-feedback" class="invalid-feedback">결제금액은 100원 이상이어야 합니다.</div>
            </div>

            <div class="mb-3">
              <label for="goods_name" class="form-label">상품명 <span class="text-danger">*</span></label>
              <input id="goods_name" name="goods_name" type="text" aria-describedby="goods_name-feedback" class="form-control" minlength="2" maxlength="100" required
                placeholder="예: 테스트상품" value="테스트 상품">
              <div id="goods_name-feedback" class="invalid-feedback">상품명을 입력해 주세요.</div>
            </div>

            <div class="row row-cols-1 row-cols-md-2 g-3">
              <div class="col">
                <div class="mb-3">
                  <label for="buyer_name" class="form-label">구매자명 <span class="text-danger">*</span></label>
                  <input id="buyer_name" name="buyer_name" type="text" aria-describedby="buyer_name-feedback" class="form-control" minlength="2" maxlength="50" required
                    value="홍길동">
                  <div id="buyer_name-feedback" class="invalid-feedback">구매자명을 입력해 주세요.</div>
                </div>
              </div>
              <div class="col">
                <div class="mb-3">
                  <label for="buyer_phone" class="form-label">구매자 연락처</label>
                  <input id="buyer_phone" name="buyer_phone" type="tel" pattern="[0-9/-]+" aria-describedby="buyer_phone-feedback" class="form-control" maxlength="20"
                    placeholder="01012345678">
                  <div id="buyer_phone-feedback" class="invalid-feedback"></div>
                </div>
              </div>
            </div>

            <div class="row row-cols-1 row-cols-md-1 g-3">
              <div class="col">
                <div class="mb-3">
                  <label for="buyer_email" class="form-label">구매자 이메일</label>
                  <input id="buyer_email" name="buyer_email" type="email" aria-describedby="buyer_email-feedback" class="form-control" maxlength="100"
                    autocomplete="email" placeholder="example@example.com">
                  <div id="buyer_email-feedback" class="invalid-feedback"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="mb-4">
            <h2 class="h6 mb-3">카드 정보</h2>

            <!-- 카드번호 필드 -->
            <div class="mb-3">
              <label for="cn_val" class="form-label">카드번호 <span class="text-danger">*</span></label>
              <input id="cn_val" type="text" name="cn_val" aria-describedby="cn_val-feedback" inputmode="numeric" pattern="[0-9\s]{15,19}" minlength="15" maxlength="19" required placeholder="15~16자리" class="form-control">
              <div id="cn_val-feedback" class="invalid-feedback">올바른 카드번호를 입력해 주세요.</div>
            </div>

            <div class="row row-cols-1 row-cols-md-2 g-3">
              <div class="col">
                <div class="mb-3">
                  <label for="expire_yymm" class="form-label">유효기간 (YYMM) <span class="text-danger">*</span></label>
                  <input id="expire_yymm" name="expire_yymm" type="text" pattern="[0-9]{4}" minlength="4" maxlength="4" aria-describedby="expire_yymm-feedback" class="form-control" inputmode="numeric"
                    required placeholder="2612">
                  <div id="expire_yymm-feedback" class="invalid-feedback">유효기간 4자리(YYMM)을 정확히 입력해 주세요.</div>
                </div>
              </div>

              <!-- 할부 선택 -->
              <div class="col">
                <div class="mb-3">
                  <label for="installment" class="form-label">할부 <span class="text-danger">*</span></label>
                  <select id="installment" name="installment" aria-describedby="installment-feedback" class="form-select" required>
                    <option value="00">일시불 (00)</option>
                    <option value="02">2개월</option>
                    <option value="03">3개월</option>
                    <option value="04">4개월</option>
                    <option value="05">5개월</option>
                    <option value="06">6개월</option>
                    <option value="07">7개월</option>
                    <option value="08">8개월</option>
                    <option value="09">9개월</option>
                    <option value="10">10개월</option>
                    <option value="11">11개월</option>
                    <option value="12">12개월</option>
                  </select>
                  <div id="installment-feedback" class="invalid-feedback"></div>
                </div>
              </div>
            </div>

            <!-- 인증 방식 선택 -->
            <div class="mb-4">
              <h2 class="h6 mb-3">인증 방식</h2>
              
              <div class="form-check form-check-inline">
                <input id="auth-method-none" class="form-check-input" type="radio" name="auth_method" value="none" checked>
                <label for="auth-method-none" class="form-check-label">비인증</label>
              </div>

              <div class="form-check form-check-inline">
                <input id="auth-method-cert" class="form-check-input" type="radio" name="auth_method" value="cert">
                <label for="auth-method-cert" class="form-check-label">구인증</label>
              </div>
            </div>

            <!-- 구 인증 필드(조건부 표시) -->
            <div id="cert-fields" style="display: none;">
              <div class="row row-cols-1 row-cols-md-2 g-3">
                <div class="col">
                  <div class="mb-3">
                    <label for="cert_pw" class="form-label">카드 비밀번호 앞 2자리</label>
                    <input id="cert_pw" name="cert_pw" type="password" class="form-control" inputmode="numeric"
                      minlength="2" maxlength="2" autocomplete="off" placeholder="예: 12" aria-describedby="cert_pw-feedback">
                    <div id="cert_pw-feedback" class="invalid-feedback"></div>
                  </div>
                </div>

                <div class="col">
                  <div class="mb-3">
                    <label for="cert_no" class="form-label">생년월일 6자리 / 사업자번호 10자리</label>
                    <input id="cert_no" name="cert_no" type="password" class="form-control" inputmode="numeric"
                      pattern="[0-9]{6,10}" minlength="6" maxlength="10" autocomplete="off" placeholder="예: 900101 또는 1234567890" aria-describedby="cert_no-feedback" >
                    <div id="cert_no-feedback" class="invalid-feedback"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <p class="text-muted small">가맹점: 테스트 가맹점</p>

          <!-- 결과 메시지 영역 -->
          <div id="result-container" style="display: none;">
            <div id="result-message" class="alert" role="alert"></div>
          </div>

          <button type="submit" class="btn btn-primary w-100" id="btnPay">결제하기</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Stage 1 테스트용 기본 검증 -->
  <script>
    // 인증 방식 선택 이벤트 핸들러
    $(document).ready(function() {
      // 1. 인증 방식 선택 시 필드 표시/숨김
      $('input[name="auth_method"]').on('change', function() {
        const certFields = $('#cert-fields');
        const certPw = $('#cert_pw');
        const certNo = $('#cert_no');

        if($(this).val() === 'cert') {
          certFields.show();
          certPw.prop('required', true);
          certNo.prop('required', true);
        } else {
          certFields.hide();
          certPw.prop('required', false);
          certNo.prop('required', false);
          certPw.val('');
          certNo.val('');
        }
      });

      // 2. 개별 필드 실시간 검증 피드백
      $('.form-control, .form-select').on('blur', function(){
        if(this.checkValidity()) {
          $(this).removeClass('is-invalid').addClass('is-valid');
        } else {
          $(this).removeClass('is-valid').addClass('is-invalid');
        }
      }).on('input', function() {
        // 입력 중에는 검증 상태 초기화 (사용자 경험 개선)
        if ($(this).hasClass('is-invalid') || $(this).hasClass('is-valid')) {
          $(this).removeClass('is-valid is-invalid');
        }
      });

      // 3. 폼 검증 및 제출
      $('#payForm').on('submit', function(e) {
        let form = this;

        if(!form.checkValidity()) {
          e.preventDefault();
          e.stopPropagation();
          $(form).addClass('was-validated');
        } else {
          e.preventDefault();
          $(form).removeClass('was-validated');
          console.log('폼이 유효합니다.');
          this.submit();
          alert('결제가 요청되었습니다. 잠시만 기다려주세요...');
        }
      });
    });
  </script>

  <!-- <script src="js/pay-form.js"></script> -->
</body>
</html>
